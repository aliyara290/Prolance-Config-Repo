spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://tenant-db:5432/tenant_db}
    username: ${DB_USERNAME:aliyara29}
    password: ${DB_PASSWORD:Yara2001}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # flyway:
  #   enabled: false

keycloak:
  base-url: ${KEYCLOAK_BASE_URL:http://keycloak:8080}
  realm: ${KEYCLOAK_REALM:prolance}
  admin:
    client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:tenant-service-client}
    client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
  user:
    client-id: ${KEYCLOAK_USER_CLIENT_ID:prolance-frontend-client}

logging:
  level:
    com.aliyara.companyservice: DEBUG
