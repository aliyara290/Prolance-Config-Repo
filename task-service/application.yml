spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5436/task_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # flyway:
  #   enabled: false

logging:
  level:
    com.dxc.taskservice: DEBUG

