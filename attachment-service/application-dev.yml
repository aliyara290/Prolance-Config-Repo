spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://attachments-db:5432/attachments_db}
    username: ${DB_USERNAME:aliyara29}
    password: ${DB_PASSWORD:Yara2001}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB
  # flyway:
  #   enabled: false

logging:
  level:
    com.dxc.attachmentservice: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE