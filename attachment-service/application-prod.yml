spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://prolance-development-postgres.ctomq0mcuql2.eu-west-3.rds.amazonaws.com:5432/attachments_db}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 6MB
  # flyway:
  #   enabled: false

logging:
  level:
    com.dxc.attachmentservice: OFF
    root: INFO
    org.springframework.web: WARN
    org.springframework.security: WARN
    org.hibernate.SQL: OFF
    org.hibernate.type.descriptor.sql.BasicBinder: OFF