spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5438/attachments_db}
    username: ${DB_USERNAME:aliyara29}
    password: ${DB_PASSWORD:Yara2001}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB
  # flyway:
  #   enabled: false

logging:
  level:
    com.dxc.attachmentservice: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,beans,refresh

services:
  tenant-service:
    url: http://localhost:8081/api/v1/
    base-url: http://localhost:8081/
  project-service:
    url: http://localhost:8083/api/v1/
    base-url: http://localhost:8083/

eureka:
  instance:
    prefer-ip-address: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
